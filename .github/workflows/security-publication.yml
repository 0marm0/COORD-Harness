name: Security and publication safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and audit tools
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install -e '.[mcp,dev]' pip-audit
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Audit Python environment
        run: python -m pip_audit
      - name: Validate docs, JSON, SVG, and image provenance
        run: |
          python .github/scripts/validate_docs.py
          pytest -q tests/test_documentation_validation.py tests/test_public_generalization.py
      - name: Run publication and extraction gate tests
        run: pytest -q tests/publication tests/extract
      - name: Check the publication manifest is complete and current
        # Deliberately its own step, ahead of the gate. The gate reports this
        # drift too, but as coverage failures mixed in with everything else it
        # checks, so a pull request that merely forgot to declare a new file
        # looks like a publication-safety failure. This step fails on its own
        # account and prints, for each finding, the exact command that fixes
        # it. Same inventory as the gate -- Git's index -- so the two cannot
        # disagree about what is checked in.
        run: python tools/extract/repin.py --check
      - name: Scan exact candidate and complete local history
        run: |
          python tools/privacy_hygiene.py --history
          python tools/publication_gate.py --candidate-ref HEAD --require-gitleaks --local-only --compact
          python tools/extract/gate.py --history --ref HEAD
      - name: Sweep the tracked tree for public-hygiene leaks
        # No PUBLIC_HYGIENE_VOCAB_FILE/PUBLIC_HYGIENE_VOCAB is configured on
        # this public workflow, so this runs the generic, pattern-based
        # checks (home paths, emails, internal work-id grammar) and says so
        # in its own output rather than claiming full coverage. A maintainer
        # running this locally can pass --vocabulary for the rest.
        run: python tools/public_hygiene_sweep.py
