<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 717 502" width="717" height="502" role="img" aria-labelledby="cast-title cast-desc"><title id="cast-title">coord done -- proof-gated completion</title><desc id="cast-desc">REAL, non-staged capture: `.venv/bin/python examples/proof-gated-done/run.py`, run from a scratch working directory outside this repository against the venv's own coord binary. The script builds its own throwaway git repo and coord.db under tempfile.TemporaryDirectory() and deletes both on exit; this transcript is its exact stdout, unedited except for the deterministic display truncation tools/render_terminal_cast.py applies to long JSON lines when rendering the SVG. Animated terminal recording of 19 real captured lines from examples/proof-gated-done/run.py showing `coord done` refused twice -- once because the declared artifact file does not exist, once because it exists on disk but is not staged in git's index -- and then accepted once `git add` stages it. Some long lines are truncated for display width; the full transcript is the committed JSON this SVG was rendered from.</desc><style>svg { background: #0d1117; } .cast-text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; white-space: pre; } .cast-chrome-title { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; } .cast-dot { opacity: 0.9; } .cast-fade { opacity: 1; transform: translateY(0); } .cast-cursor { opacity: 1; } @keyframes fade0 { from { opacity: 0; transform: translateY(3px); } } #l0 { animation: fade0 0.220s ease-out 0.250s 1 both; } @keyframes type1 { from { width: 0; } } #l1-clip rect { animation: type1 1.100s steps(92, end) 0.560s 1 both; } @keyframes fade2 { from { opacity: 0; transform: translateY(3px); } } #l2 { animation: fade2 0.220s ease-out 1.750s 1 both; } @keyframes fade4 { from { opacity: 0; transform: translateY(3px); } } #l4 { animation: fade4 0.220s ease-out 2.120s 1 both; } @keyframes type5 { from { width: 0; } } #l5-clip rect { animation: type5 1.100s steps(63, end) 2.430s 1 both; } @keyframes fade6 { from { opacity: 0; transform: translateY(3px); } } #l6 { animation: fade6 0.220s ease-out 3.620s 1 both; } @keyframes fade8 { from { opacity: 0; transform: translateY(3px); } } #l8 { animation: fade8 0.220s ease-out 3.990s 1 both; } @keyframes type9 { from { width: 0; } } #l9-clip rect { animation: type9 1.100s steps(78, end) 4.300s 1 both; } @keyframes fade10 { from { opacity: 0; transform: translateY(3px); } } #l10 { animation: fade10 0.220s ease-out 5.490s 1 both; } @keyframes fade12 { from { opacity: 0; transform: translateY(3px); } } #l12 { animation: fade12 0.220s ease-out 5.860s 1 both; } @keyframes type13 { from { width: 0; } } #l13-clip rect { animation: type13 1.100s steps(78, end) 6.170s 1 both; } @keyframes fade14 { from { opacity: 0; transform: translateY(3px); } } #l14 { animation: fade14 0.220s ease-out 7.360s 1 both; } @keyframes fade16 { from { opacity: 0; transform: translateY(3px); } } #l16 { animation: fade16 0.220s ease-out 7.730s 1 both; } @keyframes fade17 { from { opacity: 0; transform: translateY(3px); } } #l17 { animation: fade17 0.220s ease-out 8.040s 1 both; } @keyframes fade19 { from { opacity: 0; transform: translateY(3px); } } #l19 { animation: fade19 0.220s ease-out 8.410s 1 both; } @keyframes type20 { from { width: 0; } } #l20-clip rect { animation: type20 1.100s steps(78, end) 8.720s 1 both; } @keyframes fade21 { from { opacity: 0; transform: translateY(3px); } } #l21 { animation: fade21 0.220s ease-out 9.910s 1 both; } @keyframes fade23 { from { opacity: 0; transform: translateY(3px); } } #l23 { animation: fade23 0.220s ease-out 10.280s 1 both; } @keyframes fade24 { from { opacity: 0; transform: translateY(3px); } } #l24 { animation: fade24 0.220s ease-out 10.590s 1 both; } @keyframes castCursorReveal { from { opacity: 0; } to { opacity: 1; } } .cast-cursor { animation: castCursorReveal 0.4s ease-out 10.900s 1 both; } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><rect x="0" y="0" width="717" height="502" rx="10" fill="#0d1117"/><rect x="0" y="0" width="717" height="34" rx="10" fill="#161b22"/><rect x="0" y="24" width="717" height="10" fill="#161b22"/><circle class="cast-dot" cx="18" cy="17" r="5.5" fill="#ff5f56"/><circle class="cast-dot" cx="36" cy="17" r="5.5" fill="#ffbd2e"/><circle class="cast-dot" cx="54" cy="17" r="5.5" fill="#27c93f"/><text class="cast-chrome-title" x="358" y="21" text-anchor="middle">coord done -- proof-gated completion</text><line x1="0" y1="34" x2="717" y2="34" stroke="#30363d" stroke-width="1"/><g id="l0" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="61.6" fill="#d2a8ff" textLength="666.0" lengthAdjust="spacingAndGlyphs">[1/5] Create DEMO-CLA-INVOICE-EXPORT, declaring done_signal=docs/reports/invoice-export.md</text></g><clipPath id="l1-clip" clipPathUnits="userSpaceOnUse"><rect x="0" y="64.0" width="680.8" height="24"/></clipPath><g id="l1" transform="translate(18, 0)" clip-path="url(#l1-clip)"><text class="cast-text" x="0" y="81.6" fill="#7ee787" textLength="680.8" lengthAdjust="spacingAndGlyphs">$ coord create DEMO-CLA-INVOICE-EXPORT --title Export invoices as CSV --module billing --ti…</text></g><g id="l2" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="101.6" fill="#e6edf3" textLength="680.8" lengthAdjust="spacingAndGlyphs">-&gt; {"ok": true, "created": true, "work_id": "DEMO-CLA-INVOICE-EXPORT", "assignee": "claude"…</text></g><g id="l4" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="131.6" fill="#d2a8ff" textLength="259.0" lengthAdjust="spacingAndGlyphs">[2/5] Claim DEMO-CLA-INVOICE-EXPORT</text></g><clipPath id="l5-clip" clipPathUnits="userSpaceOnUse"><rect x="0" y="134.0" width="466.2" height="24"/></clipPath><g id="l5" transform="translate(18, 0)" clip-path="url(#l5-clip)"><text class="cast-text" x="0" y="151.6" fill="#7ee787" textLength="466.2" lengthAdjust="spacingAndGlyphs">$ coord claim DEMO-CLA-INVOICE-EXPORT --step writing the export</text></g><g id="l6" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="171.6" fill="#e6edf3" textLength="680.8" lengthAdjust="spacingAndGlyphs">-&gt; {"ok": true, "claim_id": "clm-873ac51b71fc", "claim_fence": "ls-80b85e22c733", "work_id"…</text></g><g id="l8" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="201.6" fill="#d2a8ff" textLength="481.0" lengthAdjust="spacingAndGlyphs">[3/5] Attempt `coord done` before the artifact file exists at all</text></g><clipPath id="l9-clip" clipPathUnits="userSpaceOnUse"><rect x="0" y="204.0" width="577.2" height="24"/></clipPath><g id="l9" transform="translate(18, 0)" clip-path="url(#l9-clip)"><text class="cast-text" x="0" y="221.6" fill="#7ee787" textLength="577.2" lengthAdjust="spacingAndGlyphs">$ coord done DEMO-CLA-INVOICE-EXPORT --artifact docs/reports/invoice-export.md</text></g><g id="l10" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="241.6" fill="#e6edf3" textLength="680.8" lengthAdjust="spacingAndGlyphs">-&gt; refused: coord: complete_claim artifact proof does not exist for claim 'clm-873ac51b71fc…</text></g><g id="l12" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="271.6" fill="#d2a8ff" textLength="666.0" lengthAdjust="spacingAndGlyphs">[4/5] Write the artifact to disk, but do NOT `git add` it, then attempt `coord done` again</text></g><clipPath id="l13-clip" clipPathUnits="userSpaceOnUse"><rect x="0" y="274.0" width="577.2" height="24"/></clipPath><g id="l13" transform="translate(18, 0)" clip-path="url(#l13-clip)"><text class="cast-text" x="0" y="291.6" fill="#7ee787" textLength="577.2" lengthAdjust="spacingAndGlyphs">$ coord done DEMO-CLA-INVOICE-EXPORT --artifact docs/reports/invoice-export.md</text></g><g id="l14" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="311.6" fill="#e6edf3" textLength="680.8" lengthAdjust="spacingAndGlyphs">-&gt; refused: coord: complete_claim artifact proof exists but is not carried by git's index f…</text></g><g id="l16" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="341.6" fill="#8b949e" textLength="495.8" lengthAdjust="spacingAndGlyphs">The file is sitting right there on disk. COORD refuses it anyway --</text></g><g id="l17" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="361.6" fill="#8b949e" textLength="451.4" lengthAdjust="spacingAndGlyphs">a done_signal must be reachable by `git diff`, not just `ls`.</text></g><g id="l19" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="391.6" fill="#d2a8ff" textLength="555.0" lengthAdjust="spacingAndGlyphs">[5/5] `git add` the artifact (staged, not committed) and retry `coord done`</text></g><clipPath id="l20-clip" clipPathUnits="userSpaceOnUse"><rect x="0" y="394.0" width="577.2" height="24"/></clipPath><g id="l20" transform="translate(18, 0)" clip-path="url(#l20-clip)"><text class="cast-text" x="0" y="411.6" fill="#7ee787" textLength="577.2" lengthAdjust="spacingAndGlyphs">$ coord done DEMO-CLA-INVOICE-EXPORT --artifact docs/reports/invoice-export.md</text></g><g id="l21" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="431.6" fill="#e6edf3" textLength="680.8" lengthAdjust="spacingAndGlyphs">-&gt; {"ok": true, "work_id": "DEMO-CLA-INVOICE-EXPORT", "artifact_path": "docs/reports/invoic…</text></g><g id="l23" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="461.6" fill="#8b949e" textLength="488.4" lengthAdjust="spacingAndGlyphs">OK: completion was refused twice for the exact reasons stated, and</text></g><g id="l24" class="cast-fade" transform="translate(18, 0)"><text class="cast-text" x="0" y="481.6" fill="#8b949e" textLength="473.6" lengthAdjust="spacingAndGlyphs">accepted only once the declared proof was staged in git's index.</text></g><rect class="cast-cursor" x="597.2" y="400.0" width="7.4" height="16" fill="#7ee787"/></svg>
